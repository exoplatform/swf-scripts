[properties]
# Any <name.version>X</name.version> whose name starts with one of these prefixes AND whose
# value is exactly the old snapshot version is rewritten. New add-ons are picked up automatically.
prefixes = ["io.meeds.", "org.exoplatform.", "addon.meeds.", "addon.exo."]
# Names containing this marker follow the dependency-management version, the others the project version.
depmgt_marker = "depmgt"
# Property names never rewritten, even if they match.
exclude = []
