# Repositories and POM properties handled by swf-branch.
# Order matters: repositories are processed top to bottom (build order).

# Branch every feature branch starts from. Overridden by $SWF_BASE_BRANCH, then by --base.
base_branch = "develop"

# Repos used when no --repos/--group/--all is given in non-interactive mode.
# (Previously: the only uncommented createFB lines in createFB.sh.)
default_repos = ["maven-exo-depmgt-pom", "commons-exo"]

# Repos whose own <version> follows the dependency-management version.
depmgt_repos = ["maven-depmgt-pom", "maven-exo-depmgt-pom"]

[orgs]
meeds = "Meeds-io"
exo = "exoplatform"

